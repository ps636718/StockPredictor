services:
  - type: web
    name: stockai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALPHATRADE_DEMO_MODE
        value: "0"
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
